---
apiVersion: v1
kind: Service
metadata:
  namespace: shopbee
  name: shopbee-keycloak
  labels:
    app: shopbee-keycloak
spec:
  ports:
    - protocol: TCP
      port: 8080
      targetPort: http
      name: http
  selector:
    app: shopbee-keycloak
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: shopbee-keycloak
  name: shopbee-keycloak-discovery
  namespace: shopbee
spec:
  selector:
    app: shopbee-keycloak
  clusterIP: None
  type: ClusterIP
---
apiVersion: apps/v1
# Use a stateful setup to ensure that for a rolling update Pods are restarted with a rolling strategy one-by-one.
# This prevents losing in-memory information stored redundantly in two Pods.
kind: StatefulSet
metadata:
  name: shopbee-keycloak
  labels:
    app: shopbee-keycloak
  namespace: shopbee
spec:
  serviceName: shopbee-keycloak-discovery
  # Run with one replica to save resources, or with two replicas to allow for rolling updates for configuration changes
  replicas: 1
  selector:
    matchLabels:
      app: shopbee-keycloak
  template:
    metadata:
      labels:
        app: shopbee-keycloak
    spec:
      containers:
        - name: shopbee-keycloak
          image: shopbee-keycloak:latest
          args: ["start", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: shopbee-idm-secrets
                  key: KC_USERNAME
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopbee-idm-secrets
                  key: KC_PASSWORD
            - name: KC_DB
              valueFrom:
                configMapKeyRef:
                  name: shopbee-idm-configs
                  key: DB_KIND
            - name: KC_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: shopbee-idm-configs
                  key: DB_URL
            - name: KC_DB_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: shopbee-idm-configs
                  key: DB_IDM_SCHEMA
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopbee-idm-secrets
                  key: DB_PASSWORD
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: shopbee-idm-secrets
                  key: DB_USERNAME
            - name: KC_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: shopbee-idm-configs
                  key: KC_HOSTNAME
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: "KC_CACHE"
              value: "ispn"
            # Passing the Pod's IP primary address to the JGroups clustering as this is required in IPv6 only setups
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Instruct JGroups which DNS hostname to use to discover other Keycloak nodes
            # Needs to be unique for each Keycloak cluster
            - name: KC_CACHE_EMBEDDED_NETWORK_BIND_ADDRESS
              value: "$(POD_IP)"
          envFrom:
            - secretRef:
                name: shopbee-idm-secrets
          ports:
            - name: http
              containerPort: 8080
            - name: jgroups
              containerPort: 7800
            - name: jgroups-fd
              containerPort: 57800
          startupProbe:
            httpGet:
              path: /health/started
              port: 9000
            periodSeconds: 1
            failureThreshold: 600
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            periodSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              cpu: 2000m
              memory: 2000Mi
            requests:
              cpu: 500m
              memory: 1700Mi
          volumeMounts:
            - name: shopbee-keycloak-realm-configs
              mountPath: /opt/keycloak/data/import
      volumes:
        - name: shopbee-keycloak-realm-configs
          configMap:
            name: shopbee-keycloak-realm-configs
---

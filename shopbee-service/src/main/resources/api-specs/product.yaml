openapi: "3.0.3"
info:
  version: 0.0.1
  title: The product management API
  description: This is the API documentation for the Product Management API.
  license:
    name: Copyright by Shopbee, all rights reserved.

tags:
  - name: products
    description: Operations about products

paths:
  /products:
    get:
      summary: Retrieve a list of products
      operationId: getProducts
      tags:
        - products
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
      responses:
        200:
          description: A list of products.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductDTO"
        401:
          description: "Unauthorized: JWT token is missing or invalid"
        403:
          description: "Forbidden: The caller does not have permission"
        500:
          description: "Internal Server Error: An unexpected error occurred"
        503:
          description: "Service Unavailable: The service is temporarily unavailable"
    post:
      summary: Create a new product
      operationId: createProduct
      tags:
        - products
      parameters:
        - $ref: "#/components/parameters/tenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 1024
                  description: "Name of the product."
                  example: "Premium Quality T-Shirt"
                sku:
                  type: string
                  maxLength: 100
                  description: "Stock Keeping Unit, unique for each product variant."
                  example: "TSHIRT-BLK-L"
                price:
                  type: number
                  description: "Price of the product."
                  example: 25.99
                description:
                  type: string
                  description: "Detailed description of the product."
                  example: "A soft, 100% cotton t-shirt available in multiple colors."
                active:
                  type: boolean
                  description: "Indicates if the product is active and available for sale."
                  example: true
                  default: true
              required:
                - name
                - price
                - sku
      responses:
        201:
          description: Product created
          headers:
            Location:
              description: The location of the created product
              schema:
                type: string
                format: uri
                example: "https://shopbee.com/api/products/a1b2c3d4-e5f6-7890-1234-567890abcdef"
        400:
          description: "Bad Request: The request is invalid"
        401:
          description: "Unauthorized: JWT token is missing or invalid"
        403:
          description: "Forbidden: The caller does not have permission"
        409:
          description: "Conflict: A product with the given SKU already exists"
        500:
          description: "Internal Server Error: An unexpected error occurred"

  /products/{productId}:
    get:
      summary: Retrieve a product by ID
      operationId: getProductById
      tags:
        - products
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/productId"
      responses:
        200:
          description: "Product found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDTO"
        401:
          description: "Unauthorized: JWT token is missing or invalid"
        403:
          description: "Forbidden: The caller does not have permission"
        404:
          description: "Not Found: The product is not found"
        500:
          description: "Internal Server Error: An unexpected error occurred"
    put:
      summary: Update a product by ID
      operationId: updateProductById
      tags:
        - products
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/productId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 1024
                  description: "Name of the product."
                  example: "Premium Quality T-Shirt"
                price:
                  type: number
                  description: "Price of the product."
                  example: 25.99
                description:
                  type: string
                  description: "Detailed description of the product."
                  example: "A soft, 100% cotton t-shirt available in multiple colors."
                active:
                  type: boolean
                  description: "Indicates if the product is active and available for sale."
                  example: true
              required:
                - name
                - price
      responses:
        200:
          description: "Product updated"
        400:
          description: "Bad Request: The request is invalid"
        401:
          description: "Unauthorized: JWT token is missing or invalid"
        403:
          description: "Forbidden: The caller does not have permission"
        404:
          description: "Not Found: The product is not found"
        500:
          description: "Internal Server Error: An unexpected error occurred"
    patch:
      summary: Patch a product by ID
      operationId: patchProductById
      tags:
        - products
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/productId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 1024
                  description: "Name of the product."
                  example: "Premium Quality T-Shirt"
                price:
                  type: number
                  description: "Price of the product."
                  example: 25.99
                description:
                  type: string
                  description: "Detailed description of the product."
                  example: "A soft, 100% cotton t-shirt available in multiple colors."
                active:
                  type: boolean
                  description: "Indicates if the product is active and available for sale."
                  example: true
      responses:
        200:
          description: "Product updated"
        400:
          description: "Bad Request: The request is invalid"
        401:
          description: "Unauthorized: JWT token is missing or invalid"
        403:
          description: "Forbidden: The caller does not have permission"
        404:
          description: "Not Found: The product is not found"
        500:
          description: "Internal Server Error: An unexpected error occurred"
    delete:
      summary: Delete a product by ID
      operationId: deleteProductById
      tags:
        - products
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/productId"
      responses:
        204:
          description: "Product deleted"
        401:
          description: "Unauthorized: JWT token is missing or invalid"
        403:
          description: "Forbidden: The caller does not have permission"
        404:
          description: "Not Found: The product is not found"
        500:
          description: "Internal Server Error: An unexpected error occurred"

  /products/{productId}/categories:
    get:
      summary: Retrieve categories associated with a product
      operationId: getProductCategories
      tags:
        - products
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/productId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
      responses:
        200:
          description: A list of categories associated with the product.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductCategoryDTO"
        401:
          description: "Unauthorized: JWT token is missing or invalid"
        403:
          description: "Forbidden: The caller does not have permission"
        404:
          description: "Not Found: The product is not found"
        500:
          description: "Internal Server Error: An unexpected error occurred"

  /products/{productId}/categories/{categoryId}:
    post:
      summary: Associate a category with a product
      operationId: addCategoryToProduct
      tags:
        - products
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/productId"
        - $ref: "#/components/parameters/categoryId"
      responses:
        201:
          description: "Category associated with product"
        400:
          description: "Bad Request: The request is invalid"
        401:
          description: "Unauthorized: JWT token is missing or invalid"
        403:
          description: "Forbidden: The caller does not have permission"
        404:
          description: "Not Found: The product or category is not found"
        500:
          description: "Internal Server Error: An unexpected error occurred"
    delete:
      summary: Remove association of a category from a product
      operationId: removeCategoryFromProduct
      tags:
        - products
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/productId"
        - $ref: "#/components/parameters/categoryId"
      responses:
        204:
          description: "Category removed from product"
        400:
          description: "Bad Request: The request is invalid"
        401:
          description: "Unauthorized: JWT token is missing or invalid"
        403:
          description: "Forbidden: The caller does not have permission"
        404:
          description: "Not Found: The product or category is not found"
        500:
          description: "Internal Server Error: An unexpected error occurred"

security:
  - BearerAuth: [ ]

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProductDTO:
      type: object
      properties:
        id:
          type: string
          description: "Unique identifier for the product (UUID)."
          example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        name:
          type: string
          maxLength: 1024
          description: "Name of the product."
          example: "Premium Quality T-Shirt"
        description:
          type: string
          description: "Detailed description of the product."
          example: "A soft, 100% cotton t-shirt available in multiple colors."
        price:
          type: number
          description: "Price of the product."
          example: 25.99
        sku:
          type: string
          maxLength: 100
          description: "Stock Keeping Unit, unique for each product variant."
          example: "TSHIRT-BLK-L"
        active:
          type: boolean
          description: "Indicates if the product is active and available for sale."
          example: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: "Timestamp of product creation."
          example: "2023-01-01T12:00:00Z"
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: "Timestamp of last product update."
          example: "2023-01-02T15:30:00Z"
        createdBy:
          type: string
          description: "Identifier of the user who created the product."
          example: "shopbee_manager"
        updatedBy:
          type: string
          description: "Identifier of the user who last updated the product."
          example: "shopbee_staff"
    Id:
      type: string
      description: "Unique identifier for the resource (UUID)."
      example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
    ProductCategoryDTO:
      type: object
      properties:
        id:
          type: string
          description: "Unique identifier for the product-category mapping (UUID)."
          example: "d4c3b2a1-6f5e-0987-4321-fedcba098765"
        name:
          type: string
          maxLength: 255
          description: "Name of the category."
          example: "Electronics"
        code:
          type: string
          maxLength: 100
          description: "Unique code for the category."
          example: "ELEC"
  parameters:
    tenantId:
      name: tenantId
      in: header
      description: "The ID of the tenant."
      required: true
      schema:
        type: string
        maxLength: 64
        example: "shopbee"
    page:
      name: page
      in: query
      description: The page number to retrieve.
      required: false
      schema:
        type: integer
        format: int32
        default: 1
        minimum: 1
        example: 1
    size:
      name: size
      in: query
      description: The number of items per page.
      required: false
      schema:
        type: integer
        format: int32
        default: 20
        minimum: 1
        maximum: 100
    productId:
      name: productId
      in: path
      description: "ID of the product."
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    categoryId:
      name: categoryId
      in: path
      description: "ID of the category."
      required: true
      schema:
        $ref: "#/components/schemas/Id"
